name: Refresh latest YouTube video
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read public YouTube feed
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, xml.etree.ElementTree as ET
          url = 'https://www.youtube.com/feeds/videos.xml?channel_id=UCggX1kRfwy7N89VGTEmmRXQ'
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as response:
              root = ET.fromstring(response.read())
          ns = {'a':'http://www.w3.org/2005/Atom','yt':'http://www.youtube.com/xml/schemas/2015'}
          entries = root.findall('a:entry', ns)
          if not entries: raise RuntimeError('No public videos returned')
          entry = max(entries, key=lambda e: e.findtext('a:published', '', ns))
          video = entry.findtext('yt:videoId', '', ns)
          if not re.fullmatch(r'[A-Za-z0-9_-]{11}', video): raise RuntimeError('Invalid video ID')
          with open('latest-video.json','w') as f:
              json.dump({'videoId':video},f)
              f.write('\n')
          PY
      - name: Save latest video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest-video.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh latest YouTube video'
          git push origin main
